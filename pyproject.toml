[project]
name = "lab-koopman"
version = "0.1.0"
description = "EDMD: a linear predictor for a nonlinear robot, by least squares"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
